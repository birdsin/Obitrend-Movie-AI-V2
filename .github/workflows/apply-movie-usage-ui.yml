name: Apply Movie Usage UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[movie-usage-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add provider usage panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          marker = '<script id="obitrend-provider-usage-script">'
          if marker in s:
              raise SystemExit("Provider usage UI already present")
          script = r'''<script id="obitrend-provider-usage-script">
(() => {
  const usageByJob = new Map();
  const money = n => Number.isFinite(Number(n)) ? Number(n).toLocaleString() : "—";
  const getSession = async () => { try { return await S.auth.getSession(); } catch { return null; } };
  const providerUsage = async (jobIds) => {
    if (!jobIds.length) return;
    try {
      const r = await S.from("provider_executions")
        .select("job_id,provider,status,provider_usage,completed_at")
        .in("job_id", jobIds);
      if (r.error) return;
      (r.data || []).forEach(x => usageByJob.set(x.job_id, x));
    } catch {}
  };
  const decorate = async () => {
    const root = document.getElementById("p10List");
    if (!root) return;
    const cards = [...root.querySelectorAll("[data-job-id]")];
    const ids = cards.map(x => x.getAttribute("data-job-id")).filter(Boolean);
    await providerUsage(ids);
    cards.forEach(card => {
      const id = card.getAttribute("data-job-id");
      const u = usageByJob.get(id);
      if (!u || card.querySelector("[data-provider-usage]")) return;
      const usage = u.provider_usage || {};
      const charged = usage.credits_charged ?? usage.creditsCharged ?? usage.provider_credits;
      const box = document.createElement("div");
      box.setAttribute("data-provider-usage", "1");
      box.className = "p10-meta";
      box.style.marginTop = "8px";
      if (charged != null) {
        box.textContent = "Provider usage: " + money(charged) + " Flixly credits · " + String(u.status || "completed");
      } else {
        box.textContent = "Provider usage: recorded without a credit amount.";
      }
      card.querySelector(".p10-body")?.appendChild(box);
    });
  };
  const original = window.obitrendLoadMovies;
  if (typeof original === "function") {
    window.obitrendLoadMovies = async (...args) => {
      const out = await original(...args);
      setTimeout(decorate, 0);
      return out;
    };
  }
  document.addEventListener("click", e => {
    if (e.target.closest("#p10Refresh")) setTimeout(decorate, 300);
  });
  setTimeout(decorate, 1200);
})();
</script>'''
          p.write_text(s + "\n" + script + "\n")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add provider usage visibility [movie-usage-ui]"
          git push
